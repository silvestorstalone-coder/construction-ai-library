name: Full Architecture & AI Automation

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  architecture-and-ai:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}

    steps:

      ########################################################
      # Checkout
      ########################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ########################################################
      # Node setup
      ########################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      ########################################################
      # Install tools
      ########################################################

      - name: Install dependency-cruiser & jq
        run: |
          npm install -g dependency-cruiser
          sudo apt-get update
          sudo apt-get install -y jq curl

      ########################################################
      # Architecture check
      ########################################################

      - name: Run architecture check
        run: |
          npx depcruise . --config .dependency-cruiser.cjs

      ########################################################
      # Pipeline validation
      ########################################################

      - name: Pipeline validation
        run: |
          echo "Проверка SYSTEM_PIPELINE и DOMAIN_MODEL"

          test -f docs/SYSTEM_PIPELINE.md && echo "SYSTEM_PIPELINE.md найден" || echo "!!! SYSTEM_PIPELINE.md отсутствует"
          test -f docs/DOMAIN_MODEL.md && echo "DOMAIN_MODEL.md найден" || echo "!!! DOMAIN_MODEL.md отсутствует"

          gs_count=$(find . -type f -name "*.gs" | wc -l)
          echo "Найдено модулей .gs: $gs_count"

      ########################################################
      # Yandex GPT test
      ########################################################

      - name: Test Yandex GPT API
        run: |
          echo "Проверка токена Яндекс GPT"

          curl -s -X POST https://llm.api.cloud.yandex.net/foundationModels/v1/completion \
            -H "Authorization: Api-Key $YANDEX_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"modelUri":"gpt://b1g9du8j9im5ar92bag3/yandexgpt-lite","completionOptions":{"temperature":0.3,"maxTokens":50},"messages":[{"role":"user","text":"Проверка подключения ИИ"}]}' \
            | jq

      ########################################################
      # Save report
      ########################################################

      - name: Save architecture report
        run: |
          mkdir -p reports
          npx depcruise . --config .dependency-cruiser.cjs > reports/dependency-report.txt

          echo "Отчет сохранен в reports/dependency-report.txt"
