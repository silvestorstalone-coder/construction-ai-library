name: Full Architecture & AI Automation

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  architecture-and-ai:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}

    steps:
      ########################################################
      # 1. Checkout
      ########################################################
      - name: Checkout repository
        uses: actions/checkout@v4

      ########################################################
      # 2. Node.js setup
      ########################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      ########################################################
      # 3. Install tools
      ########################################################
      - name: Install dependency-cruiser & jq
        run: |
          npm install -g dependency-cruiser
          sudo apt-get update
          sudo apt-get install -y jq curl

      ########################################################
      # 4. Architecture check (debug mode)
      ########################################################
      - name: Run architecture check (debug)
        run: |
          echo "=== DEBUG: Architecture Scan ==="
          mkdir -p reports
          # Проверка на циклы и ошибки, не падаем
          npx depcruise . --config .dependency-cruiser.cjs --output-type err \
            || echo "⚠️ Найдены архитектурные предупреждения или циклы, CI продолжает работу"
          # Сохранение полного отчета
          npx depcruise . --config .dependency-cruiser.cjs > reports/dependency-report.txt
          echo "Отчёт debug зависимостей сохранён в reports/dependency-report.txt"

      ########################################################
      # 5. Pipeline & Domain validation (debug)
      ########################################################
      - name: Pipeline & Domain validation (debug)
        run: |
          echo "=== DEBUG: Pipeline & Domain check ==="
          test -f docs/SYSTEM_PIPELINE.md \
            && echo "SYSTEM_PIPELINE.md найден" \
            || echo "!!! SYSTEM_PIPELINE.md отсутствует"
          test -f docs/DOMAIN_MODEL.md \
            && echo "DOMAIN_MODEL.md найден" \
            || echo "!!! DOMAIN_MODEL.md отсутствует"
          gs_count=$(find . -type f -name "*.gs" | wc -l)
          echo "Найдено модулей .gs: $gs_count"

      ########################################################
      # 6. Yandex GPT test (debug)
      ########################################################
      - name: Test Yandex GPT API (debug)
        run: |
          echo "=== DEBUG: Yandex GPT API ==="
          curl -s -X POST https://llm.api.cloud.yandex.net/foundationModels/v1/completion \
            -H "Authorization: Api-Key $YANDEX_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"modelUri":"gpt://b1g9du8j9im5ar92bag3/yandexgpt-lite","completionOptions":{"temperature":0.3,"maxTokens":50},"messages":[{"role":"user","text":"Проверка подключения ИИ"}]}' \
            | jq

      ########################################################
      # 7. Save architecture report
      ########################################################
      - name: Save architecture report
        run: |
          echo "=== DEBUG: Save full report ==="
          mkdir -p reports
          npx depcruise . --config .dependency-cruiser.cjs > reports/dependency-report.txt
          echo "Отчёт сохранен в reports/dependency-report.txt"
