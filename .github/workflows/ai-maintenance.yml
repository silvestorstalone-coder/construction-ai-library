name: AI Maintenance & Full Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ai-maintenance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install -g dependency-cruiser
          npm install node-fetch fs-extra

      - name: Debug GS files
        run: |
          echo "Searching for .gs files"
          find . -name "*.gs"

      - name: Move and index .gs files
        run: node ai_tasks/move_and_index_gs.js

      - name: Run architecture check
        run: npx depcruise . --config .dependency-cruiser.cjs

      - name: Update SYSTEM_PIPELINE.md
        run: node ai_runner.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*
          git diff --cached --quiet || git commit -m "AI Maintenance: update docs"
          git pull --rebase origin main
          git push origin main
