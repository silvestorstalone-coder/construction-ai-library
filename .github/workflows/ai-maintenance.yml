name: AI Maintenance & Full Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ai-maintenance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install -g dependency-cruiser
          npm install node-fetch fs-extra

      - name: Debug GS files
        run: |
          echo "Searching for .gs files"
          find . -name "*.gs"

      - name: Move and index .gs files
        run: node ai_tasks/move_and_index_gs.js

      - name: Run architecture check
        run: npx depcruise . --config .dependency-cruiser.cjs

      - name: Update SYSTEM_PIPELINE.md
        run: node ai_runner.js

      - name: Commit and push changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. ПРИНУДИТЕЛЬНО удаляем node_modules из индекса (если они там есть)
          git rm -r --cached node_modules || echo "node_modules already clean"
          
          # 2. Добавляем ваши рабочие папки
          git add modules/ MODULE_INDEX.md docs/ SYSTEM_PIPELINE.md
          
          # 3. Фиксируем удаления (чтобы старые пути .gs исчезли из репозитория)
          git add -u 

          # 4. Коммитим изменения
          git diff --cached --quiet || git commit -m "AI Maintenance: move files and cleanup node_modules"
          
          # 5. Синхронизация и пуш
          git pull --rebase origin main
          git push origin main
