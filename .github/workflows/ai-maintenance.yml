name: AI Maintenance & Full Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main ]

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

concurrency:
  group: ai-maintenance-main
  cancel-in-progress: false

jobs:

  ai-maintenance:

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install -g dependency-cruiser
          npm install node-fetch fs-extra

      ########################################################

      - name: Move and Index modules
        run: node ai_tasks/move_and_index_gs.js

      ########################################################

      - name: Commit structure
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modules/
          git add docs/

          git diff --cached --quiet || git commit -m "System: Update Index [skip ci]"

          git push origin main || echo "Nothing to push"

      ########################################################

      - name: Architecture check
        run: |
          npx depcruise . --config .dependency-cruiser.cjs || echo "Architecture warning"

      ########################################################

      - name: AI modernization
        run: node ai_runner.js

      ########################################################

      - name: Final docs sync
        run: |

          git add docs/

          git diff --cached --quiet || git commit -m "AI docs sync [skip ci]"

          git push origin main || echo "Up to date"
