name: AI Maintenance & Full Pipeline

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ai-maintenance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      # Исправляем Warning: форсируем Node 24 для внутренних процессов экшенов
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4 # ОБНОВЛЕНО с v3 до v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install -g dependency-cruiser
          npm install node-fetch fs-extra

      - name: 1. Move and Index .gs files
        run: node ai_tasks/move_and_index_gs.js

      - name: 2. Commit Structure Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached node_modules || echo "node_modules already clean"
          git add modules/ docs/
          git add -u
          git diff --cached --quiet || git commit -m "System: Update Index and Structure [skip ci]"
          git pull --rebase origin main
          git push origin main || echo "No structure changes to push"

      - name: 3. Run Architecture Check
        run: npx depcruise . --config .dependency-cruiser.cjs || echo "Architecture issues found, but continuing..."

      - name: 4. Run AI Modernization (ai_runner.js)
        run: node ai_runner.js

      - name: 5. Final Cleanup and Docs Sync
        run: |
          git pull --rebase origin main
          git add docs/
          git diff --cached --quiet || git commit -m "AI: Final sync and docs update [skip ci]"
          git push origin main || echo "Everything is up to date"
